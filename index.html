></section></main><nav><button class="tab active" data-s="capture"><span>🎙</span><small>話す</small></button><button class="tab" data-s="today"><span>☑️</span><small>今日</small><b id="badge" class="badge hidden">0</b></button><button class="tab" data-s="library"><span>📚</span><small>本棚</small></button></nav><script>(()=>{'use strict';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random(),fmt=t=>{t=Math.max(0,+t||0);let m=Math.floor(t/60),s=Math.floor(t%60),h=Math.floor((t%1)*100);return `${m}:${String(s).padStart(2,'0')}.${String(h).padStart(2,'0')}`},srt=t=>{t=Math.max(0,t);let h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=Math.floor(t%60),ms=Math.floor((t%1)*1000);return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')},${String(ms).padStart(3,'0')}`},day=d=>{d=new Date(d||Date.now());return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let db,session=null,mode='mic',rec=null,stream=null,chunks=[],recognition=null,recording=false,start=0,timer=null,obj=null,filter='pending',lastFinal=0;const openDB=()=>new Promise((res,rej)=>{let r=indexedDB.open('shinVoiceLab',1);r.onupgradeneeded=()=>{let d=r.result;['sessions','audio','tasks'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)}),store=(n,m='readonly')=>db.transaction(n,m).objectStore(n),put=(n,v)=>new Promise((res,rej)=>{let r=store(n,'readwrite').put(v);r.onsuccess=()=>res(v);r.onerror=()=>rej(r.error)}),get=(n,k)=>new Promise((res,rej)=>{let r=store(n).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}),all=n=>new Promise((res,rej)=>{let r=store(n).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});function fresh(src){let d=new Date;return{id:id(),source:src,title:src==='mic'?`音声メモ ${d.toLo ).forEach(b=>b.onclick=()=>{audio.currentTime=+b.dataset.mtime;audio.play()});$('#off').textContent=`${session.offset>=0?'+':'−'}${Math.abs(session.offset).toFixed(2)}秒`;let i=session.insight;$('#organizeOut').innerHTML=i?`${i.summary?'<b>要約</b><br>'+i.summary+'<br><br>':''}${i.todos?.length?'<b>TODO</b><br>'+i.todos.map(x=>'・'+x).join('<br>')+'<br><br>':''}${i.seeds?.length?'<b>歌の種</b><br>'+i.seeds.map(x=>'・'+x).join('<br>'):''}`:'TODOや歌の種を端末内ルールで拾います。'}$('#offM').onclick=()=>{session.offset=Math.max(-3,session.offset-.05);save();render()};$('#offP').onclick=()=>{session.offset=Math.min(3,session.offset+.05);save();render()};function exportTxt(){return session.segments.map(x=>x.text).join('\n')}function exportSrt(){return session.segments.map((x,i)=>`${i+1}\n${srt(Math.max(0,x.start+session.offset))} --> ${srt(Math.max(.05,x.end+session.offset))}\n${x.text}`).join('\n\n')}async function share(name,text){try{await navigator.share({title:session.title,text})}catch{await navigator.clipboard.writeText(text);alert('コピーしました')}}$('#srt').onclick=()=>share('SRT',exportSrt());$('#txt').onclick=()=>share('TXT',exportTxt());$('#organizeBtn').onclick=()=>{let text=exportTxt(),sent=text.replace(/。/g,'。\n').split(/\n+/).filter(Boolean),a=['しなきゃ','しないと','やる','やろう','必要','あとで','確認','送る','作る','連絡','予約','買う','返信','準備'],g=['歌','曲','歌詞','サビ','Suno','気持ち','光','闇','夢'];session.insight={summary:sent.slice(0,3).join(' '),todos:sent.filter(x=>a.some(w=>x.includes(w))).slice(0,8),seeds:sent.filter(x=>g.some(w=>x.includes(w))).slice(0,8)};save();render()};async function scanSession(s){let a=['しなきゃ','しないと','やる','やろう','必要','あとで','確認','送る','作る','連絡','予約','買う','返信','準備'],done=['終わった','完了','やった','できた','送った','確認した','買った'],ex=await all('tasks');for(let x of s.segments){if(!a.some(w=>x.text.includes(w))||done.some(w=>x.text.includes(w)))continue;let fp=`${day(s.createdAt)}|${s.id}|${x.text.replace(/\s/g,'')}`;if(ex.some(t=>t.fp===fp))continue;await put('tasks',{id:id(),sessionId:s.id,sessionTitle:s.title,time:x.start,action:x.text,createdAt:new Date().toISOString(),status:'pending',fp})}}$('#scan').onclick=async()=>{for(let s of(await all('sessions')).filter(x=>day(x.createdAt)===day()))await scanSession(s);renderTasks();badge()};$$('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.f;$$('.filter').forEach(x=>x.classList.toggle('active',x===b));renderTasks()});async function renderTasks(){let ts=await all('tasks');if(filter!=='all')ts=ts.filter(t=>t.status===filter);$('#tasks').innerHTML=ts.length?ts.map(t=>`<div class="listrow"><div class="row"><button class="timebtn" data-open-task="${t.id}">${fmt(t.time)}</button><b>${t.action}</b></div><div class="muted tiny">${t.sessionTitle}</div><div class="row" style="margin-top:7px"><button data-st="${t.id}|pending">未処理</button><button data-st="${t.id}|hold">保留</button><button data-st="${t.id}|done">完了</button></div></div>`).join(''):'<p class="muted tiny">ここは空です。</p>';$$('[data-st]').forEach(b=>b.onclick=async()=>{let [i,s]=b.dataset.st.split('|'),t=await get('tasks',i);t.status=s;await put('tasks',t);renderTasks();badge()});$$('[data-open-task]').forEach(b=>b.onclick=async()=>{let t=await get('tasks',b.dataset.openTask),s=await get('sessions',t.sessionId);setMode(s.source);setSession(s);await loadAudio();show('capture');audio.currentTime=t.time}) ;let p=(await all('tasks')).filter(t=>t.status==='pending'&&day(t.createdAt)===day()).length;$('#pending').textContent=p+'件'}async function badge(){let n=(await all('tasks')).filter(t=>t.status==='pending'&&day(t.createdAt)===day()).length;$('#badge').textContent=n;$('#badge').classList.toggle('hidden',!n)}$('#shareToday').onclick=async()=>{let ss=(await all('sessions')).filter(s=>day(s.createdAt)===day()),ts=(await all('tasks')).filter(t=>day(t.createdAt)===day()&&(t.status==='pending'||t.status==='hold'));let text=`# 今日のコンテキスト ${day()}\n\n## 未処理\n${ts.length?ts.map(t=>'- [ ] '+t.action).join('\n'):'- なし'}\n\n## 今日しゃべった内容\n`+ss.map(s=>`\n### ${s.title}\n${s.segments.map(x=>'- '+fmt(x.start)+' '+x.text).join('\n')}`).join('\n');share('今日',text)}async function renderLib(){let q=$('#search').value.toLowerCase(),ss=await all('sessions');ss.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));if(q)ss=ss.filter(s=>(s.title+' '+s.segments.map(x=>x.text).join(' ')).toLowerCase().includes(q));$('#sessions').innerHTML=ss.length?ss.map(s=>`<div class="listrow" data-open="${s.id}"><div class="libtitle">${s.title}</div><div class="preview">${s.segments.map(x=>x.text).join(' ')||'音声のみ'}</div><div class="muted tiny">${fmt(s.duration)}・${s.category}</div></div>`).join(''):'<p class="muted tiny">まだ記録がありません。</p>';$$('[data-open]').forEach(r=>r.onclick=async()=>{let s=await get('sessions',r.dataset.open);setMode(s.source);setSession(s);await loadAudio();show('capture')})}$('#search').oninput=renderLib;$('#newBtn').onclick=()=>setSession(fresh(mode));$('#name').onchange=save;$('#cat').onchange=save;$('#lang').onchange=save;if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)$('#install').classList.add('hidden');if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));openDB().then(()=>{setSession(fresh('mic'));setMode('mic');badge();renderTasks()})})();</script></body></html>
