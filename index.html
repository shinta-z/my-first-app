<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>Shin Voice Lab</title>
<style>
:root{--bg:#0b0c10;--card:#171920;--line:#2d323d;--text:#f7f8fb;--muted:#9da6b5;--blue:#2f7df6;--red:#e94b5a;--safe:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;min-height:100dvh}button,input,select{font:inherit}button{min-height:44px;border:1px solid var(--line);border-radius:12px;background:#22252d;color:var(--text);padding:8px 12px}.primary{background:var(--blue);border-color:transparent;font-weight:700}.hidden{display:none!important}.muted{color:var(--muted)}header{position:sticky;top:0;z-index:5;padding:18px 16px 8px;background:linear-gradient(var(--bg) 88%,transparent);display:flex;justify-content:space-between;align-items:end}header small{color:var(--muted);letter-spacing:.14em}h1{margin:2px 0 0;font-size:28px}.new{font-size:24px;width:44px;padding:0}main{padding:0 14px calc(84px + var(--safe))}.screen{display:none}.screen.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:14px}.seg button{border:0;background:transparent}.seg button.active{background:#252a33}.hero{text-align:center;padding:22px 14px}.rec{width:140px;height:140px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ff7f88,#df3443 65%,#90131e);font-weight:800;font-size:20px}.rec.on{animation:pulse 1.2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(233,75,90,.1)}}.clock{font-size:30px;font-variant-numeric:tabular-nums;font-weight:700;margin-top:10px}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.wide{width:100%}input,select{width:100%;background:#0f1116;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px}.titleinput{font-size:18px;font-weight:700}.filepick{display:flex;justify-content:center;align-items:center;min-height:54px;background:var(--blue);border-radius:14px;font-weight:700}.filepick input{display:none}.time{display:flex;justify-content:space-between;align-items:end}.time b{font-size:26px;font-variant-numeric:tabular-nums}.seek{padding:0;accent-color:var(--blue);margin:10px 0}.controls{display:grid;grid-template-columns:1fr 1fr 1.2fr 1fr 1fr;gap:5px}.listrow{border-top:1px solid var(--line);padding:10px 0}.listrow:first-child{border-top:0}.segment{display:flex;gap:8px;align-items:flex-start}.segment .txt{flex:1;line-height:1.5}.timebtn{font-family:ui-monospace,monospace;font-size:12px;min-width:70px;padding:5px}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.filters button.active{background:var(--blue)}.tiny{font-size:12px}.badge{position:absolute;background:var(--red);color:#fff;border-radius:9px;min-width:18px;height:18px;font-size:10px;display:flex;align-items:center;justify-content:center;margin-left:28px;margin-top:-28px;padding:0 5px}nav{position:fixed;bottom:0;left:0;right:0;height:calc(66px + var(--safe));padding-bottom:var(--safe);display:grid;grid-template-columns:repeat(3,1fr);background:rgba(15,16,20,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line)}nav button{border:0;border-radius:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}nav button.active{color:#79b7ff}nav span{font-size:21px}nav small{font-size:10px}.statusok{color:#7fe2a7}.statusbad{color:#ff8b94}
</style>
</head>
<body>
<header><div><small>SHIN VOICE LAB</small><h1 id="pageTitle">話す</h1></div><button id="newBtn" class="new">＋</button></header>
<main>
<section id="capture" class="screen active">
<div class="card"><b>📱 iPhone版 v2</b><p class="muted tiny">まず「話す」「今日」「本棚」が反応すれば修正版が読み込まれています。</p></div>
<div class="seg"><button class="mode active" data-mode="mic">🎙 話す</button><button class="mode" data-mode="file">🎵 曲・音声</button></div>
<div id="micMode"><div class="card hero"><button id="recordBtn" class="rec">●<br>話す</button><div id="clock" class="clock">0:00.00</div><p id="status" class="muted tiny">タップすると録音を始めます</p><div id="liveText" class="card hidden" style="text-align:left;margin-top:12px"></div><button id="markNow" class="hidden">★ 今ここをマーク</button></div></div>
<div id="fileMode" class="card hidden"><label class="filepick">🎵 音声ファイルを選ぶ<input id="fileInput" type="file" accept="audio/*,.mp3,.m4a,.wav,.aac"></label><p class="muted tiny">曲は再生・時間確認・手動字幕に使えます。</p></div>
<div id="meta" class="card"><input id="name" class="titleinput" placeholder="タイトル"><div class="row" style="margin-top:8px"><select id="cat"><option>メモ</option><option>歌の種</option><option>仕事</option><option>TODO</option><option>会話</option><option>その他</option></select><select id="lang"><option value="ja-JP">日本語</option><option value="en-US">English</option></select></div></div>
<div id="player" class="card hidden"><audio id="audio" preload="metadata"></audio><div class="time"><div><small class="muted">現在</small><br><b id="cur">0:00.00</b></div><div style="text-align:right"><small class="muted">長さ</small><br><span id="dur">0:00.00</span></div></div><input id="seek" class="seek" type="range" min="0" max="1" step="0.01" value="0"><div class="controls"><button data-jump="-10">−10</button><button data-jump="-1">−1</button><button id="playBtn" class="primary">▶︎</button><button data-jump="1">＋1</button><button data-jump="10">＋10</button></div><div class="row" style="margin-top:10px"><input id="markerName" placeholder="マーカー名"><button id="addMarker">★追加</button></div><div id="markers"></div></div>
<div id="transcript" class="card hidden"><div class="row between"><b>文字起こし / 字幕</b><button id="addSubtitle">＋字幕</button></div><div id="segments"></div><div class="row between" style="margin-top:10px"><span>字幕全体</span><div class="row"><button id="offsetMinus">−.05</button><span id="offsetLabel" class="tiny">−0.30秒</span><button id="offsetPlus">＋.05</button></div></div><div class="row" style="margin-top:10px"><button id="shareSrt" class="primary">SRT共有</button><button id="shareTxt">TXT共有</button></div></div>
</section>
<section id="today" class="screen"><div class="card"><div class="row between"><div><b>今日の未処理</b><div id="pending" class="muted tiny">0件</div></div><button id="scanBtn" class="primary">✨スキャン</button></div><div class="filters" style="margin-top:10px"><button class="filter active" data-filter="pending">未処理</button><button class="filter" data-filter="hold">保留</button><button class="filter" data-filter="done">完了</button><button class="filter" data-filter="all">全部</button></div><div id="taskList"></div><button id="shareToday" class="wide">今日を共有</button></div></section>
<section id="library" class="screen"><div class="card"><input id="search" placeholder="🔎 全文検索"><div id="libraryList"></div></div></section>
</main>
<nav><button class="tab active" data-screen="capture"><span>🎙</span><small>話す</small></button><button class="tab" data-screen="today"><span>☑️</span><small>今日</small><b id="badge" class="badge hidden">0</b></button><button class="tab" data-screen="library"><span>📚</span><small>本棚</small></button></nav>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
function uid(){return String(Date.now())+'-'+Math.random().toString(16).slice(2)}
function fmt(t){t=Math.max(0,Number(t)||0);var m=Math.floor(t/60),s=Math.floor(t%60),h=Math.floor((t%1)*100);return m+':'+String(s).padStart(2,'0')+'.'+String(h).padStart(2,'0')}
function day(d){d=new Date(d||Date.now());return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s||'').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function srtTime(t){t=Math.max(0,t);var h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=Math.floor(t%60),ms=Math.floor((t%1)*1000);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+','+String(ms).padStart(3,'0')}
var db=null,session=null,mode='mic',recording=false,startAt=0,timer=null,stream=null,recorder=null,chunks=[],recognition=null,lastFinal=0,objectURL=null,taskFilter='pending';
function openDB(){return new Promise(function(resolve,reject){var r=indexedDB.open('shinVoiceLabFix',1);r.onupgradeneeded=function(){var d=r.result;['sessions','audio','tasks'].forEach(function(n){if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};r.onsuccess=function(){db=r.result;resolve()};r.onerror=function(){reject(r.error)}})}
function st(n,m){return db.transaction(n,m||'readonly').objectStore(n)}
function put(n,v){return new Promise(function(resolve,reject){var r=st(n,'readwrite').put(v);r.onsuccess=function(){resolve(v)};r.onerror=function(){reject(r.error)}})}
function get(n,k){return new Promise(function(resolve,reject){var r=st(n).get(k);r.onsuccess=function(){resolve(r.result)};r.onerror=function(){reject(r.error)}})}
function all(n){return new Promise(function(resolve,reject){var r=st(n).getAll();r.onsuccess=function(){resolve(r.result||[])};r.onerror=function(){reject(r.error)}})}
function fresh(src){var d=new Date();return{id:uid(),source:src,title:src==='mic'?'音声メモ '+d.toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'新しい音声',category:src==='mic'?'メモ':'歌の種',lang:'ja-JP',createdAt:d.toISOString(),updatedAt:d.toISOString(),duration:0,segments:[],markers:[],offset:-0.30,audioId:null}}
function setSession(s){session=s;$('#name').value=s.title||'';$('#cat').value=s.category||'メモ';$('#lang').value=s.lang||'ja-JP';render()}
async function save(){if(!session)return;session.title=$('#name').value.trim()||session.title;session.category=$('#cat').value;session.lang=$('#lang').value;session.updatedAt=new Date().toISOString();await put('sessions',session)}
function setMode(m){mode=m;$$('.mode').forEach(function(b){b.classList.toggle('active',b.dataset.mode===m)});$('#micMode').classList.toggle('hidden',m!=='mic');$('#fileMode').classList.toggle('hidden',m!=='file');if(!session||session.source!==m)setSession(fresh(m))}
$$('.mode').forEach(function(b){b.addEventListener('click',function(){setMode(b.dataset.mode)})});
function show(name){$$('.screen').forEach(function(s){s.classList.toggle('active',s.id===name)});$$('.tab').forEach(function(b){b.classList.toggle('active',b.dataset.screen===name)});$('#pageTitle').textContent=name==='capture'?'話す':name==='today'?'今日':'本棚';if(name==='today')renderTasks();if(name==='library')renderLibrary()}
$$('.tab').forEach(function(b){b.addEventListener('click',function(){show(b.dataset.screen)})});
function elapsed(){return recording?(performance.now()-startAt)/1000:(session?session.duration:0)}
async function startRecording(){try{session=fresh('mic');setSession(session);stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];var options={};if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('audio/mp4'))options.mimeType='audio/mp4';recorder=new MediaRecorder(stream,options);recorder.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};recorder.start(1000);recording=true;startAt=performance.now();lastFinal=0;$('#recordBtn').classList.add('on');$('#recordBtn').innerHTML='■<br>止める';$('#markNow').classList.remove('hidden');$('#status').textContent='録音中';timer=setInterval(function(){$('#clock').textContent=fmt(elapsed())},40);startSpeech()}catch(e){$('#status').textContent='マイクを開始できません';alert('マイクを開始できません: '+(e.message||e))}}
async function stopRecording(){recording=false;clearInterval(timer);try{if(recognition)recognition.stop()}catch(e){}if(recorder&&recorder.state!=='inactive'){await new Promise(function(resolve){recorder.onstop=resolve;recorder.stop()})}if(stream)stream.getTracks().forEach(function(t){t.stop()});session.duration=elapsed();$('#clock').textContent=fmt(session.duration);$('#recordBtn').classList.remove('on');$('#recordBtn').innerHTML='●<br>話す';$('#markNow').classList.add('hidden');if(chunks.length){var blob=new Blob(chunks,{type:(recorder&&recorder.mimeType)||'audio/mp4'}),aid=uid();await put('audio',{id:aid,blob:blob});session.audioId=aid;attach(blob)}await save();await scanSession(session);$('#status').textContent='保存しました';render();updateBadge()}
function startSpeech(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#status').textContent='録音中。音声認識APIなしのため音声のみ保存';return}recognition=new SR();recognition.lang=session.lang;recognition.continuous=true;recognition.interimResults=true;recognition.onresult=function(e){var inter='';for(var i=e.resultIndex;i<e.results.length;i++){var r=e.results[i],text=(r[0]&&r[0].transcript?r[0].transcript:'').trim();if(!text)continue;if(r.isFinal){var end=elapsed();session.segments.push({id:uid(),start:lastFinal,end:end,text:text});lastFinal=end}else{inter+=text}}$('#liveText').textContent=inter;$('#liveText').classList.toggle('hidden',!inter);render()};recognition.onend=function(){if(recording)setTimeout(function(){try{recognition.start()}catch(e){}},250)};try{recognition.start()}catch(e){}}
$('#recordBtn').addEventListener('click',function(){recording?stopRecording():startRecording()});
function attach(blob){if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(blob);$('#audio').src=objectURL;$('#player').classList.remove('hidden')}
async function loadAudio(){if(!session||!session.audioId)return;var a=await get('audio',session.audioId);if(a&&a.blob)attach(a.blob)}
$('#fileInput').addEventListener('change',async function(){var f=this.files&&this.files[0];if(!f)return;session=fresh('file');session.title=f.name.replace(/\.[^.]+$/,'');setSession(session);var aid=uid();await put('audio',{id:aid,blob:f});session.audioId=aid;attach(f);await save()});
var audio=$('#audio');audio.addEventListener('loadedmetadata',function(){session.duration=Number.isFinite(audio.duration)?audio.duration:0;$('#dur').textContent=fmt(session.duration);$('#seek').max=String(Math.max(1,session.duration));save()});audio.addEventListener('timeupdate',function(){$('#cur').textContent=fmt(audio.currentTime);$('#seek').value=String(audio.currentTime||0)});audio.addEventListener('play',function(){$('#playBtn').textContent='❚❚'});audio.addEventListener('pause',function(){$('#playBtn').textContent='▶︎'});$('#playBtn').addEventListener('click',function(){audio.paused?audio.play():audio.pause()});$('#seek').addEventListener('change',function(){audio.currentTime=Number(this.value)||0});$$('[data-jump]').forEach(function(b){b.addEventListener('click',function(){audio.currentTime=Math.max(0,Math.min(audio.duration||0,(audio.currentTime||0)+Number(b.dataset.jump)))})});
function addMarker(name){if(!session)return;var t=recording?elapsed():(audio.currentTime||0);session.markers.push({id:uid(),time:t,title:(name||'重要').trim()||'重要'});render();save()}
$('#markNow').addEventListener('click',function(){addMarker('重要')});$('#addMarker').addEventListener('click',function(){addMarker($('#markerName').value);$('#markerName').value=''});
$('#addSubtitle').addEventListener('click',function(){if(!session)return;var t=audio.currentTime||0;session.segments.push({id:uid(),start:t,end:t+2,text:'新しい字幕'});render();save()});
function render(){if(!session)return;$('#transcript').classList.toggle('hidden',session.segments.length===0);$('#segments').innerHTML=session.segments.map(function(s){return '<div class="listrow segment"><button class="timebtn" data-seg-time="'+s.start+'">'+fmt(s.start)+'</button><div class="txt">'+esc(s.text)+'</div><button class="tiny" data-edit="'+s.id+'">編集</button></div>'}).join('');$$('[data-seg-time]').forEach(function(b){b.addEventListener('click',function(){if(audio.src){audio.currentTime=Number(b.dataset.segTime);audio.play()}})});$$('[data-edit]').forEach(function(b){b.addEventListener('click',function(){var s=session.segments.find(function(x){return x.id===b.dataset.edit}),v=prompt('文字を編集',s.text);if(v!==null){s.text=v;save();render()}})});$('#markers').innerHTML=session.markers.map(function(m){return '<div class="listrow row"><button class="timebtn" data-mark-time="'+m.time+'">'+fmt(m.time)+'</button><span style="flex:1">'+esc(m.title)+'</span></div>'}).join('');$$('[data-mark-time]').forEach(function(b){b.addEventListener('click',function(){if(audio.src){audio.currentTime=Number(b.dataset.markTime);audio.play()}})});$('#offsetLabel').textContent=(session.offset>=0?'+':'−')+Math.abs(session.offset).toFixed(2)+'秒'}
$('#offsetMinus').addEventListener('click',function(){session.offset=Math.max(-3,session.offset-.05);render();save()});$('#offsetPlus').addEventListener('click',function(){session.offset=Math.min(3,session.offset+.05);render();save()});
function plainText(){return session.segments.map(function(x){return x.text}).join('\n')}
function srtText(){return session.segments.map(function(x,i){return (i+1)+'\n'+srtTime(Math.max(0,x.start+session.offset))+' --> '+srtTime(Math.max(.05,x.end+session.offset))+'\n'+x.text}).join('\n\n')}
async function shareText(title,text){try{if(navigator.share){await navigator.share({title:title,text:text})}else{await navigator.clipboard.writeText(text);alert('コピーしました')}}catch(e){if(e.name!=='AbortError'){try{await navigator.clipboard.writeText(text);alert('コピーしました')}catch(_){} }}}
$('#shareSrt').addEventListener('click',function(){shareText('SRT',srtText())});$('#shareTxt').addEventListener('click',function(){shareText('文字起こし',plainText())});
async function scanSession(s){if(!s||!s.segments.length)return;var action=['しなきゃ','しないと','やる','やろう','必要','あとで','確認','送る','作る','連絡','予約','買う','投稿','公開','直す','修正','調べる','電話','返信','準備'];var done=['終わった','済んだ','完了','やった','できた','送った','確認した','直した','買った','投稿した','公開した','返信した'];var existing=await all('tasks');for(var i=0;i<s.segments.length;i++){var seg=s.segments[i],t=seg.text||'';if(!action.some(function(w){return t.indexOf(w)>=0})||done.some(function(w){return t.indexOf(w)>=0}))continue;var fp=day(s.createdAt)+'|'+s.id+'|'+t.replace(/\s/g,'');if(existing.some(function(x){return x.fingerprint===fp}))continue;await put('tasks',{id:uid(),sessionId:s.id,sessionTitle:s.title,time:seg.start,action:t,status:'pending',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),fingerprint:fp})}}
$('#scanBtn').addEventListener('click',async function(){var sessions=await all('sessions'),today=day();for(var i=0;i<sessions.length;i++)if(day(sessions[i].createdAt)===today)await scanSession(sessions[i]);renderTasks();updateBadge()});$$('.filter').forEach(function(b){b.addEventListener('click',function(){taskFilter=b.dataset.filter;$$('.filter').forEach(function(x){x.classList.toggle('active',x===b)});renderTasks()})});
async function renderTasks(){var tasks=await all('tasks');tasks.sort(function(a,b){return new Date(b.updatedAt)-new Date(a.updatedAt)});if(taskFilter!=='all')tasks=tasks.filter(function(t){return t.status===taskFilter});$('#taskList').innerHTML=tasks.length?tasks.map(function(t){return '<div class="listrow"><div class="row"><button class="timebtn" data-open-task="'+t.id+'">'+fmt(t.time)+'</button><b style="flex:1">'+esc(t.action)+'</b></div><div class="row" style="margin-top:8px"><button data-task="'+t.id+'|pending">未処理</button><button data-task="'+t.id+'|hold">保留</button><button data-task="'+t.id+'|done">完了</button></div></div>'}).join(''):'<p class="muted tiny">ここは空です。</p>';$$('[data-task]').forEach(function(b){b.addEventListener('click',async function(){var p=b.dataset.task.split('|'),t=await get('tasks',p[0]);if(t){t.status=p[1];t.updatedAt=new Date().toISOString();await put('tasks',t);renderTasks();updateBadge()}})});$$('[data-open-task]').forEach(function(b){b.addEventListener('click',async function(){var t=await get('tasks',b.dataset.openTask),s=t&&await get('sessions',t.sessionId);if(!s)return;setMode(s.source);setSession(s);await loadAudio();show('capture');if(audio.src)audio.currentTime=t.time||0})});var every=await all('tasks'),n=every.filter(function(t){return t.status==='pending'&&day(t.createdAt)===day()}).length;$('#pending').textContent=n+'件'}
async function updateBadge(){var tasks=await all('tasks'),n=tasks.filter(function(t){return t.status==='pending'&&day(t.createdAt)===day()}).length;$('#badge').textContent=String(n);$('#badge').classList.toggle('hidden',n===0)}
$('#shareToday').addEventListener('click',async function(){var ss=(await all('sessions')).filter(function(s){return day(s.createdAt)===day()}),tasks=(await all('tasks')).filter(function(t){return day(t.createdAt)===day()&&(t.status==='pending'||t.status==='hold')}),text='# 今日の未処理\n'+(tasks.length?tasks.map(function(t){return '- [ ] '+t.action}).join('\n'):'- なし')+'\n\n# 今日しゃべった内容\n'+ss.map(function(s){return '## '+s.title+'\n'+s.segments.map(function(x){return '- '+fmt(x.start)+' '+x.text}).join('\n')}).join('\n\n');shareText('今日のコンテキスト',text)});
async function renderLibrary(){var q=$('#search').value.toLowerCase(),ss=await all('sessions');ss.sort(function(a,b){return new Date(b.updatedAt)-new Date(a.updatedAt)});if(q)ss=ss.filter(function(s){return (s.title+' '+s.segments.map(function(x){return x.text}).join(' ')).toLowerCase().indexOf(q)>=0});$('#libraryList').innerHTML=ss.length?ss.map(function(s){return '<div class="listrow" data-open-session="'+s.id+'"><b>'+esc(s.title)+'</b><div class="muted tiny" style="margin-top:4px">'+fmt(s.duration)+'・'+esc(s.category)+'</div></div>'}).join(''):'<p class="muted tiny">まだ記録がありません。</p>';$$('[data-open-session]').forEach(function(r){r.addEventListener('click',async function(){var s=await get('sessions',r.dataset.openSession);setMode(s.source);setSession(s);await loadAudio();show('capture')})})}
